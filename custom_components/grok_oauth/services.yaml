generate_content:
  name: Generate content
  description: Send a prompt to a selected Grok chat model using the SuperGrok OAuth session.
  fields:
    config_entry:
      name: SuperGrok OAuth entry
      required: true
      selector:
        config_entry:
          integration: grok_oauth
    prompt:
      name: Prompt
      required: true
      selector:
        text:
          multiline: true
    model:
      name: Model
      required: false
      selector:
        text:

generate_image:
  name: Generate image
  description: Generate an image with Grok Imagine via /v1/images/generations (and /v1/image/generations).
  fields:
    config_entry:
      name: SuperGrok OAuth entry
      required: true
      selector:
        config_entry:
          integration: grok_oauth
    prompt:
      name: Prompt
      required: true
      selector:
        text:
          multiline: true
    model:
      name: Imagine model
      required: false
      example: grok-imagine-image-2.0
      selector:
        text:
    n:
      name: Number of images
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 8
    aspect_ratio:
      name: Aspect ratio
      required: false
      selector:
        select:
          options:
            - "1:1"
            - "16:9"
            - "9:16"
            - "4:3"
            - "3:4"
            - "3:2"
            - "2:3"
            - "2:1"
            - "1:2"
            - auto
    resolution:
      name: Resolution
      required: false
      selector:
        select:
          options:
            - "1k"
            - "2k"
    response_format:
      name: Response format
      required: false
      default: url
      selector:
        select:
          options:
            - url
            - b64_json

